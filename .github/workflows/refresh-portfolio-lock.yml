name: Refresh portfolio lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-portfolio-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/portfolio-95

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Resolve dependency graph
        run: npm install --package-lock-only

      - name: Install refreshed graph
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify source
        run: npm run check

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "Refresh dependency lockfile"
          git push origin HEAD:feature/portfolio-95
